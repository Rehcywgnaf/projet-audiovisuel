http {
    # Configuration des zones upstream avec surveillance
    upstream sapav_backend {
        zone backend_zone 64k;

        # Serveurs principaux
        server backend1.sapav.local:3000 weight=5 max_fails=2 fail_timeout=30s;
        server backend2.sapav.local:3000 weight=5 max_fails=2 fail_timeout=30s;
        
        # Serveurs de backup
        server backup1.sapav.local:3000 backup;
        server backup2.sapav.local:3000 backup;

        # Répartition par least_conn pour une meilleure distribution
        least_conn;

        # Surveillance active des serveurs
        check interval=3000 rise=2 fall=5 timeout=1000 type=http;
        check_http_send "HEAD / HTTP/1.0\r\n\r\n";
        check_http_expect_alive http_2xx http_3xx;
    }

    # Configuration du cache avec zones distinctes
    proxy_cache_path /var/cache/nginx/main levels=1:2 keys_zone=main_cache:10m max_size=10g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/backup levels=1:2 keys_zone=backup_cache:5m max_size=5g inactive=30m use_temp_path=off;

    # Configuration générale du serveur
    server {
        listen 80;
        server_name sapav.local;

        # Surveillance de la santé du serveur
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }

        # Configuration du proxy avec failover
        location / {
            proxy_pass http://sapav_backend;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Headers pour le proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts adaptés
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Cache principal
            proxy_cache main_cache;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 60m;
            proxy_cache_valid 404 5m;
            proxy_cache_background_update on;
        }

        # Configuration spéciale pour les ressources statiques
        location /static/ {
            proxy_pass http://sapav_backend;
            proxy_cache backup_cache;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 120m;
            proxy_cache_valid 404 1m;
            expires 2h;
            add_header Cache-Control "public";
        }

        # Gestion des erreurs
        error_page 502 503 504 /error.html;
        location = /error.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # Surveillance des métriques pour le monitoring
    vhost_traffic_status_zone;
    vhost_traffic_status_filter_by_set_key $status status::*;
}

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}