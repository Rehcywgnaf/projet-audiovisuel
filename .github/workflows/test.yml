name: Tests et Vérification d'Intégrité

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Tests et Vérifications
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configuration Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Installation des dépendances
      run: |
        npm ci
        npm install -D @testing-library/react @testing-library/react-hooks jest @types/jest

    - name: Vérification TypeScript
      run: npx tsc --noEmit

    - name: Tests Unitaires
      run: |
        npm run test -- --coverage
        mkdir -p coverage
        cp -r coverage/lcov-report/* coverage/

    - name: Tests d'Intégration
      run: |
        npm run test:integration
        if [ $? -eq 0 ]; then
          echo "Tests d'intégration réussis"
        else
          echo "Erreur dans les tests d'intégration"
          exit 1
        fi

    - name: Vérification de l'intégrité
      run: |
        node scripts/verify-integrity.js

    - name: Publication Rapport de Tests
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: coverage/

    - name: Notification Slack
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
